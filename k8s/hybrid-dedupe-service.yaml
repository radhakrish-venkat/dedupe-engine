apiVersion: v1
kind: Service
metadata:
  name: hybrid-dedupe-service
  namespace: dedupe-engine
  labels:
    app: hybrid-dedupe-ingest
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP
  - name: metrics
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: health
    port: 8081
    targetPort: 8081
    protocol: TCP
  selector:
    app: hybrid-dedupe-ingest
  sessionAffinity: None
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
# Internal service for cluster communication
apiVersion: v1
kind: Service
metadata:
  name: hybrid-dedupe-internal
  namespace: dedupe-engine
  labels:
    app: hybrid-dedupe-ingest
spec:
  type: ClusterIP
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP
  - name: metrics
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: hybrid-dedupe-ingest
